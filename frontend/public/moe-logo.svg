<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="moeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B7B3F"/>
      <stop offset="100%" stop-color="#0E5C2D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5C842"/>
      <stop offset="100%" stop-color="#C99A2E"/>
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="90" r="78" fill="url(#moeGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="100" cy="90" r="70" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6"/>

  <!-- Crossed swords -->
  <g stroke="url(#goldGrad)" stroke-width="3.2" stroke-linecap="round" fill="none">
    <line x1="55" y1="135" x2="135" y2="55"/>
    <line x1="145" y1="135" x2="65" y2="55"/>
    <!-- Sword handles -->
    <circle cx="55" cy="135" r="3.5" fill="url(#goldGrad)"/>
    <circle cx="145" cy="135" r="3.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Palm tree -->
  <g fill="url(#goldGrad)">
    <!-- Trunk -->
    <rect x="97" y="78" width="6" height="38" rx="2"/>
    <!-- Fronds -->
    <path d="M100 78 Q 75 65, 65 50 Q 80 60, 100 73 Z"/>
    <path d="M100 78 Q 125 65, 135 50 Q 120 60, 100 73 Z"/>
    <path d="M100 78 Q 70 70, 55 65 Q 75 70, 99 76 Z"/>
    <path d="M100 78 Q 130 70, 145 65 Q 125 70, 101 76 Z"/>
    <path d="M100 75 Q 85 55, 85 40 Q 95 55, 100 73 Z"/>
    <path d="M100 75 Q 115 55, 115 40 Q 105 55, 100 73 Z"/>
    <!-- Coconuts -->
    <circle cx="93" cy="80" r="2.3"/>
    <circle cx="107" cy="80" r="2.3"/>
    <circle cx="100" cy="83" r="2.3"/>
  </g>

  <!-- Arabic text below -->
  <text x="100" y="190" text-anchor="middle" fill="#0E5C2D" font-family="Tajawal, Arial" font-weight="900" font-size="18">وزارة التعليم</text>
  <text x="100" y="208" text-anchor="middle" fill="#0E5C2D" font-family="Tajawal, Arial" font-weight="700" font-size="11">Ministry of Education</text>
</svg>
