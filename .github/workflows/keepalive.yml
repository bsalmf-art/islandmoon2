name: Keep Render Backend Alive

on:
  schedule:
    # Every 10 minutes — keeps Render free instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://namu-blog-api.onrender.com/api/" --max-time 90 || echo "000")
            echo "Status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is awake ✓"
              exit 0
            fi
            sleep 15
          done
          echo "Backend did not respond after 6 attempts"
          # Don't fail the workflow even if backend is slow — we still tried
          exit 0
